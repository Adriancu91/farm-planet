#bar{width:min(360px,70vw);height:18px;border-radius:12px;background:rgba(255,255,255,.4);border:3px solid #fff;margin:14px auto 4px;overflow:hidden}

#loadTxt{font-size:16px}

.looking #joy,.looking #quest,.looking #jump,.looking #act,.looking #seeds,.looking #veh,.looking .side{display:none!important}
#rotate{position:fixed;inset:0;z-index:30;background:linear-gradient(#7cc7ff,#bde8a8);display:none;place-items:center;text-align:center;color:#fff;font-weight:800;font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.25);padding:20px}
#rotate .ph{font-size:80px;display:inline-block;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:grid}}
#play{margin-top:14px;border:5px solid #fff;border-radius:22px;background:var(--accent);color:#fff;font-weight:800;font-size:28px;padding:10px 34px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-family:inherit;text-shadow:none}
</style>
</head>

{const sn={};for(const k in S.seen)sn[OLD[k]||k]=true;S.seen={};for(const k in sn)if(ANIMALS[k])S.seen[k]=true;}

function resolveCollisions(p,rad){
  for(const c of colliders){const dx=p.x-c.x,dz=p.z-c.z;
    if(c.r!==undefined){const R=c.r+rad;if(Math.abs(dx)>R||Math.abs(dz)>R)continue;const d=Math.hypot(dx,dz);if(d<R&&d>1e-4){p.x=c.x+dx/d*R;p.z=c.z+dz/d*R;}}

function updatePlayer(dt){

  if(keys.KeyW||keys.ArrowUp)iy=-1;if(keys.KeyS||keys.ArrowDown)iy=1;if(keys.KeyA||keys.ArrowLeft)ix=-1;if(keys.KeyD||keys.ArrowRight)ix=1;

  else{player.speed=lerp(player.speed,0,Math.min(1,dt*10));mx=Math.sin(player.face);mz=Math.cos(player.face);}

  else animChar(pch,dt,{});
  if(player.veh){const v=vehicles[player.veh];for(const w of v.userData.wheels)w.rotation.x+=player.speed*dt*1.6;v.position.y=Math.sin(T*30)*.012*player.speed/6;
    const ahead=H(player.pos.x+mx*1.2,player.pos.z+mz*1.2),behind=H(player.pos.x-mx*1.2,player.pos.z-mz*1.2);v.rotation.x=lerp(v.rotation.x,-Math.atan2(ahead-behind,2.4),.2);}}
function updatePlots(dt){const m=growMult();for(let i=0;i<S.unl;i++){const p=S.plots[i];if(p.c&&p.p<1){p.p=Math.min(1,p.p+dt/CROPS[p.c].t*m);refreshPlot(i);}}
  for(let i=0;i<S.unl;i++){const o=plotObjs[i];if(o.ready.visible)o.ready.position.y=1.8+Math.sin(T*3+i)*.12;}}
function updateAnimals(dt){for(const o of animalObjs){const a=o.a,D=ANIMALS[a.t];
  if(!a.rd){a.pt+=dt;if(a.pt>=D.prod.t){if(S.own.hambar){S.inv[D.prod.n]=(S.inv[D.prod.n]||0)+1;a.pt=0;}else a.rd=true;}}
  o.ic.visible=a.rd;if(a.rd)o.ic.position.y=D.h+.7+Math.sin(T*3+a.id)*.1;
  const g=o.m.g;const [px,pz]=PEN_POS[o.pen];const dx=o.tx-g.position.x,dz=o.tz-g.position.z,d=Math.hypot(dx,dz);
  let moving=false;if(o.wait>0)o.wait-=dt;else if(d<.2){o.tx=px+rand(-2.6,2.6);o.tz=pz+rand(-2.6,2.6);o.wait=rand(1.5,6);}
  else{const s=(D.sp||.9)*dt;g.position.x+=dx/d*s;g.position.z+=dz/d*s;g.rotation.y=angLerp(g.rotation.y,Math.atan2(dx,dz),dt*5);moving=true;}
  setMove(o.m,moving);if(Math.hypot(g.position.x-player.pos.x,g.position.z-player.pos.z)<80)o.m.mixer.update(dt);
  if(g.userData.horn)g.userData.horn.material.emissiveIntensity=.3+Math.sin(T*3)*.2;}}
let eggTimer=0;
function updateEggs(dt){const p=player.pos;const rr=S.own.cos?3:1.7;
  for(let i=worldEggs.length-1;i>=0;i--){const e=worldEggs[i];e.t+=dt;e.e.position.y=.6+Math.sin(e.t*2.5)*.12;e.e.rotation.y+=dt;
    const d=Math.hypot(p.x-e.x,p.z-e.z);e.g.visible=d<280;
    if(d<rr+(player.veh?1:0)){scene.remove(e.g);worldEggs.splice(i,1);if(e.gold)S.gold++;else S.eggs++;S.st.eggs++;toast(e.gold?'🌟 Ai găsit un OU DE AUR!':'🥚 Ai găsit un ou misterios!');sfx.pick();happy();hud();save();}}
  eggTimer+=dt;if(eggTimer>12&&worldEggs.length<maxEggs()){eggTimer=0;spawnEgg();}}
function updateFriends(dt){for(const fo of friendObjs){
  const pd=Math.hypot(player.pos.x-fo.pos.x,player.pos.z-fo.pos.z);
  if(!fo.ch&&!fo.loading&&pd<95){fo.loading=true;makeChar(fo.f.ch).then(c=>{fo.ch=c;c.root.position.copy(fo.pos);scene.add(c.root);setAccessory(c,fo.f.acc);
      const nm=textSprite(fo.f.n,{size:.8,bg:'rgba(255,255,255,.92)'});nm.position.y=c.height+.35;c.root.add(nm);}).catch(()=>{fo.loading=false;});}
  const dx=fo.tx-fo.pos.x,dz=fo.tz-fo.pos.z,d=Math.hypot(dx,dz);let mv=false;
  if(fo.wait>0)fo.wait-=dt;else if(d<.3){const pl=pick(fo.plots);fo.tx=pl.x+rand(-1.5,1.5);fo.tz=pl.z+1.9;fo.wait=rand(2,6);}
  else{const s=1.9*dt;fo.pos.x+=dx/d*s;fo.pos.z+=dz/d*s;fo.rot=angLerp(fo.rot,Math.atan2(dx,dz),dt*8);mv=true;}
  if(!mv&&pd<6)fo.rot=angLerp(fo.rot,Math.atan2(player.pos.x-fo.pos.x,player.pos.z-fo.pos.z),dt*5);
  if(fo.ch){fo.ch.root.position.copy(fo.pos);fo.ch.root.rotation.y=fo.rot;if(pd<70)animChar(fo.ch,dt,{moving:mv,speed:.4});fo.ch.root.visible=pd<160;}
  for(const pl of fo.plots){if(!pl.need){pl.timer-=dt;if(pl.timer<=0)pl.need=true;}pl.drop.visible=pl.need;if(pl.need)pl.drop.position.y=1.8+Math.sin(T*3+pl.x)*.12;}
  if(pd<80)fo.pet.mixer.update(dt);}}
function updateWorld(dt){for(const s of spinners){if(s.t==='spin')s.o.rotation.z+=dt*.8;if(s.t==='bob'){s.o.position.y=.95+Math.sin(T*2)*.08;s.o.rotation.y+=dt*.5;}}
  for(const c of clouds){c.position.x+=dt*2;if(c.position.x>440)c.position.x=-440;}
  grassUni.uTime.value=T;
  for(const k in locks){const L=locks[k];L.g.children[2].visible=Math.hypot(L.x-player.pos.x,L.z-player.pos.z)>4.5;}
  for(const ch of chunks){const d=Math.hypot(ch.x-player.pos.x,ch.z-player.pos.z);const near=d<(MOBILE?70:95);ch.g.visible=near;ch.f.visible=!near;}}
const camPos=new THREE.Vector3(), lookAt=new THREE.Vector3();
function updateCamera(dt){const p=player.pos;
  camera.layers.set(lookOpen?1:0);
  if(lookOpen){const f=player.face;const hh=pch.height;camPos.set(p.x+Math.sin(f)*2.05,p.y+hh*.68,p.z+Math.cos(f)*2.05);lookAt.set(p.x,p.y+hh*.56,p.z);camera.position.lerp(camPos,Math.min(1,dt*8));camera.lookAt(lookAt);
    const W=innerWidth,Hh=innerHeight;camera.setViewOffset(W,Hh,Math.min(W*.24,230),0,W,Hh);pch.root.rotation.y=Math.sin(T*.6)*.45;}
  else{if(camera.view&&camera.view.enabled){camera.clearViewOffset();pch.root.rotation.y=0;}
    const dist=player.veh?camDist+3.5:camDist;
    if(Math.abs(joy.vx)+Math.abs(joy.vy)>.1&&drag.id===null){const behind=player.face+Math.PI;camYaw=angLerp(camYaw,behind,dt*(player.veh?1.6:.6)*(joy.vy<0?1:.3));}
    camPos.set(p.x+Math.sin(camYaw)*dist*Math.cos(camPitch),p.y+1.25+Math.sin(camPitch)*dist,p.z+Math.cos(camYaw)*dist*Math.cos(camPitch));
    const gy=H(camPos.x,camPos.z)+.5;if(camPos.y<gy)camPos.y=gy;
    camera.position.lerp(camPos,Math.min(1,dt*10));lookAt.set(p.x,p.y+1.05,p.z);camera.lookAt(lookAt);}
  if(window.DC){camera.position.set(...window.DC[0]);camera.lookAt(...window.DC[1]);}
  sky.position.copy(camera.position);
  sun.position.copy(p).addScaledVector(SUN_DIR,90);sun.target.position.copy(p);}

/* ================= MINIMAP ================= */
const mini=$('#mini'),mg=mini.getContext('2d');
function drawMini(){const W=224,c=W/2,s=(W/2-6)/185;mg.clearRect(0,0,W,W);mg.save();mg.beginPath();mg.arc(c,c,c,0,7);mg.clip();
  mg.fillStyle='#8a8580';mg.fillRect(0,0,W,W);mg.fillStyle='#4f8a36';mg.beginPath();mg.arc(c,c,128*s,0,7);mg.fill();mg.fillStyle='#6cb04a';mg.beginPath();mg.arc(c,c,60*s,0,7);mg.fill();
  mg.strokeStyle='#d8b77d';mg.lineWidth=4;for(const p of PATHS){mg.beginPath();mg.moveTo(c,c);mg.lineTo(c+p[2]*s,c+p[3]*s);mg.stroke();}
  mg.fillStyle='#3fb0ec';mg.beginPath();mg.arc(c+LAKE.x*s,c+LAKE.z*s,LAKE.r*s,0,7);mg.fill();
  mg.fillStyle='#c89b6d';mg.fillRect(c-22*s,c-22*s,44*s,44*s);mg.font='bold 20px sans-serif';mg.textAlign='center';mg.textBaseline='middle';mg.fillText('🏡',c,c);
  for(const fo of friendObjs){const f=fo.f;mg.fillStyle='#'+f.c.toString(16).padStart(6,'0');mg.beginPath();mg.arc(c+f.x*s,c+f.z*s,9,0,7);mg.fill();mg.fillStyle='#fff';mg.font='bold 12px sans-serif';mg.fillText(f.n[0],c+f.x*s,c+f.z*s+1);}
  if(S.own.busola||S.own.safari)for(const e of worldEggs){mg.fillStyle=e.gold?'#ffd54f':'#fff';mg.beginPath();mg.arc(c+e.x*s,c+e.z*s,4,0,7);mg.fill();}
  const px=c+player.pos.x*s,pz=c+player.pos.z*s;mg.translate(px,pz);mg.rotate(-player.face+Math.PI);mg.fillStyle='#ff3d6e';mg.strokeStyle='#fff';mg.lineWidth=2.5;mg.beginPath();mg.moveTo(0,-10);mg.lineTo(7,7);mg.lineTo(-7,7);mg.closePath();mg.fill();mg.stroke();
  mg.restore();}

/* ================= INIT & LOOP ================= */
for(let i=0;i<S.pens;i++)buildPen(i);
for(const id in BUILD)if(S.own[id])buildBuilding(id);
for(const id in VEH)if(S.own[id])spawnVehicle(id);
refreshPlots();refreshLocks();placeAnimals();hud();
if(S.pos)player.pos.y=H(player.pos.x,player.pos.z);
camYaw=player.face+Math.PI;
let T=0,last=performance.now(),uiT=0,mapT=0,saveT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  updatePlayer(dt);updatePlots(dt);updateAnimals(dt);updateEggs(dt);updateFriends(dt);updateWorld(dt);updateCamera(dt);
  uiT+=dt;if(uiT>.12){uiT=0;updateActionUI();$('#quest').textContent=quest();}
  mapT+=dt;if(mapT>.2){mapT=0;drawMini();}
  saveT+=dt;if(saveT>8){saveT=0;save();}
  renderer.render(scene,camera);requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.FP={S,player,scene,camera,renderer,friendObjs,get T(){return T}};
$('#barI').style.width='100%';
$('#loadTxt').outerHTML='<br><button id="play">▶ Joacă</button>';
$('#play').addEventListener('click',async()=>{snd(660,.1,'triangle');
  try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
  $('#load').remove();resize();});
requestAnimationFrame(loop);
if(!S.tut){S.tut=true;openModal(`<h2>🌍 Bun venit la Farm Planet!</h2>
<p>🕹️ <b>Joystick</b> stânga jos pentru mers, <b>Sari</b> în dreapta. Trage cu degetul pe ecran ca să rotești camera.</p>
<p>🌱 Plantează legume pe parcelele maro, așteaptă să crească și <b>recoltează</b>.</p>
<p>💰 Vinde-le la <b>Piață</b> și cumpără clădiri, unelte, tractor și mașină safari din 🛒.</p>
<p>🥚 Caută <b>ouă misterioase</b> în pădure și la munte (luminițele!). La <b>Cuibul magic</b> poate ieși un animal (60%) sau poate fi gol (40%).</p>
<p>🤝 Pe hartă sunt fermele prietenilor <b>Ana, Luca și Sofia</b> — ajută-i și primești cadouri!</p>
<p>👗 Alege-ți personajul, accesoriile și culoarea părului din butonul mov.</p>
<div style="text-align:center;margin-top:10px"><button class="big" data-close>Hai să jucăm! 🚀</button></div>`);save();}
</script>
