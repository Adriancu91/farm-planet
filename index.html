@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:grid}}
#play{margin-top:14px;border:5px solid #fff;border-radius:22px;background:var(--accent);color:#fff;font-weight:800;font-size:28px;padding:10px 34px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-family:inherit;text-shadow:none}
</style>
</head>

function nearest(){

  for(let i=0;i<S.unl;i++){const [x,z]=PLOT_POS[i];consider(Math.hypot(p.x-x,p.z-z),{t:'plot',i},player.veh?2.6:2);}
  consider(Math.hypot(p.x-MARKET.x,p.z-MARKET.z-1.4),{t:'market'},2.8);
  consider(Math.hypot(p.x-NEST.x,p.z-NEST.z),{t:'nest'},2.9);
  for(const k in locks){const L=locks[k];consider(Math.hypot(p.x-L.x,p.z-L.z),{t:'lock',k},2.4);}
  if(!S.own.hambar)for(const o of animalObjs)if(o.a.rd)consider(Math.hypot(p.x-o.m.g.position.x,p.z-o.m.g.position.z),{t:'animal',o},2.2);
  for(const fo of friendObjs)for(const pl of fo.plots)if(pl.need)consider(Math.hypot(p.x-pl.x,p.z-pl.z),{t:'help',fo,pl},2.2);
  if(!player.veh)for(const id in vehicles)consider(Math.hypot(p.x-vehicles[id].position.x,p.z-vehicles[id].position.z),{t:'veh',id},2.6);
  for(const fo of friendObjs)consider(Math.hypot(p.x-fo.ch.g.position.x,p.z-fo.ch.g.position.z),{t:'talk',fo},2);
  return best;}

function resolveCollisions(p,rad){
  for(const c of colliders){const dx=p.x-c.x,dz=p.z-c.z;
    if(c.r!==undefined){const R=c.r+rad;if(Math.abs(dx)>R||Math.abs(dz)>R)continue;const d=Math.hypot(dx,dz);if(d<R&&d>1e-4){p.x=c.x+dx/d*R;p.z=c.z+dz/d*R;}}
    else{const ox=c.hw+rad-Math.abs(dx),oz=c.hd+rad-Math.abs(dz);if(ox>0&&oz>0){if(ox<oz)p.x+=Math.sign(dx)*ox;else p.z+=Math.sign(dz)*oz;}}}
  const r=Math.hypot(p.x,p.z);if(r>182){p.x*=182/r;p.z*=182/r;}}

  if(modalOn&&!lookOpen){ix=iy=0;}if(lookOpen){ix=iy=0;}
  const mag=Math.min(1,Math.hypot(ix,iy));
  const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
  let mx=fx*(-iy)+rx*ix, mz=fz*(-iy)+rz*ix;const ml=Math.hypot(mx,mz);
  const sp=player.veh?VEH[player.veh].sp:6;
  if(ml>.05){mx/=ml;mz/=ml;player.face=angLerp(player.face,Math.atan2(mx,mz),Math.min(1,dt*(player.veh?5:12)));player.speed=lerp(player.speed,sp*mag,Math.min(1,dt*8));
    if(player.veh){mx=Math.sin(player.face);mz=Math.cos(player.face);}}
  else{player.speed=lerp(player.speed,0,Math.min(1,dt*10));mx=Math.sin(player.face);mz=Math.cos(player.face);}
  player.pos.x+=mx*player.speed*dt;player.pos.z+=mz*player.speed*dt;
  resolveCollisions(player.pos,player.veh?1.1:.4);
  const gy=H(player.pos.x,player.pos.z);
  player.vy-=24*dt;player.pos.y+=player.vy*dt;
  if(player.pos.y<=gy){player.pos.y=gy;player.vy=0;player.ground=true;}else if(player.pos.y-gy>.15)player.ground=false;
  root.position.copy(player.pos);root.rotation.y=player.face;

  if(player.veh){const v=vehicles[player.veh];for(const w of v.userData.wheels)w.rotation.x+=player.speed*dt*1.6;v.position.y=Math.sin(T*30)*.012*player.speed/6;
    const ahead=H(player.pos.x+mx*1.2,player.pos.z+mz*1.2),behind=H(player.pos.x-mx*1.2,player.pos.z-mz*1.2);v.rotation.x=lerp(v.rotation.x,-Math.atan2(ahead-behind,2.4),.2);}
}

    if(d<rr+(player.veh?1:0)){scene.remove(e.g);worldEggs.splice(i,1);if(e.gold)S.gold++;else S.eggs++;S.st.eggs++;toast(e.gold?'🌟 Ai găsit un OU DE AUR!':'🥚 Ai găsit un ou misterios!');sfx.pick();hud();save();}}
  eggTimer+=dt;if(eggTimer>12&&worldEggs.length<maxEggs()){eggTimer=0;spawnEgg();}}
function updateFriends(dt){for(const fo of friendObjs){const g=fo.ch.g;const dx=fo.tx-g.position.x,dz=fo.tz-g.position.z,d=Math.hypot(dx,dz);let mv=false;
  if(fo.wait>0)fo.wait-=dt;else if(d<.3){const pl=pick(fo.plots);fo.tx=pl.x+rand(-1.5,1.5);fo.tz=pl.z+1.8;fo.wait=rand(2,6);}else{const s=2.2*dt;g.position.x+=dx/d*s;g.position.z+=dz/d*s;g.rotation.y=angLerp(g.rotation.y,Math.atan2(dx,dz),dt*8);mv=true;}
  const pd=Math.hypot(player.pos.x-g.position.x,player.pos.z-g.position.z);if(!mv&&pd<6)g.rotation.y=angLerp(g.rotation.y,Math.atan2(player.pos.x-g.position.x,player.pos.z-g.position.z),dt*5);
  animChar(fo.ch,mv,dt,false,false);
  for(const pl of fo.plots){if(!pl.need){pl.timer-=dt;if(pl.timer<=0)pl.need=true;}pl.drop.visible=pl.need;if(pl.need)pl.drop.position.y=1.7+Math.sin(T*3+pl.x)*.12;}
  fo.pet.t+=dt;fo.pet.body.position.y=Math.sin(fo.pet.t*2)*.01;}}
function updateWorld(dt){for(const s of spinners){if(s.t==='spin')s.o.rotation.z+=dt*.8;if(s.t==='bob'){s.o.position.y=.95+Math.sin(T*2)*.08;s.o.rotation.y+=dt*.5;}}
  for(const c of clouds){c.position.x+=dt*1.5;if(c.position.x>300)c.position.x=-300;}}
const camPos=new THREE.Vector3(), lookAt=new THREE.Vector3();
function updateCamera(dt){
  const p=player.pos;
  camera.layers.set(lookOpen?1:0);
  if(lookOpen){const f=player.face;camPos.set(p.x+Math.sin(f)*3.6,p.y+1.6,p.z+Math.cos(f)*3.6);lookAt.set(p.x,p.y+1.05,p.z);camera.position.lerp(camPos,Math.min(1,dt*8));camera.lookAt(lookAt);
    const W=innerWidth,Hh=innerHeight;camera.setViewOffset(W,Hh,Math.min(W*.24,220),0,W,Hh);pch.g.rotation.y=Math.sin(T*.8)*.5;}
  else if(camera.view&&camera.view.enabled){camera.clearViewOffset();pch.g.rotation.y=0;}
  else{const dist=player.veh?camDist+3.5:camDist;
    if(Math.abs(joy.vx)+Math.abs(joy.vy)>.1&&drag.id===null&&!keys.KeyA&&!keys.KeyD){const behind=player.face+Math.PI;camYaw=angLerp(camYaw,behind,dt*(player.veh?1.6:.6)*Math.abs(-joy.vy>0?1:.3));}
    camPos.set(p.x+Math.sin(camYaw)*dist*Math.cos(camPitch),p.y+1.6+Math.sin(camPitch)*dist,p.z+Math.cos(camYaw)*dist*Math.cos(camPitch));
    const gy=H(camPos.x,camPos.z)+.6;if(camPos.y<gy)camPos.y=gy;
    camera.position.lerp(camPos,Math.min(1,dt*10));lookAt.set(p.x,p.y+1.5,p.z);camera.lookAt(lookAt);}
  sky.position.copy(camera.position);
  sun.position.set(p.x+40,p.y+70,p.z+25);sun.target.position.copy(p);sunDisc.position.set(camera.position.x+200,camera.position.y+330,camera.position.z+120);
}
/* ================= MINIMAP ================= */
const mini=$('#mini'),mg=mini.getContext('2d');
function drawMini(){const W=224,c=W/2,s=(W/2-6)/185;mg.clearRect(0,0,W,W);mg.save();mg.beginPath();mg.arc(c,c,c,0,7);mg.clip();
  mg.fillStyle='#8a8580';mg.fillRect(0,0,W,W);mg.fillStyle='#4f9a3a';mg.beginPath();mg.arc(c,c,128*s,0,7);mg.fill();mg.fillStyle='#74c94f';mg.beginPath();mg.arc(c,c,60*s,0,7);mg.fill();
  mg.strokeStyle='#e0c08a';mg.lineWidth=4;for(const p of PATHS){mg.beginPath();mg.moveTo(c,c);mg.lineTo(c+p[2]*s,c+p[3]*s);mg.stroke();}
  mg.fillStyle='#3fb0ec';mg.beginPath();mg.arc(c+LAKE.x*s,c+LAKE.z*s,LAKE.r*s,0,7);mg.fill();
  mg.fillStyle='#c89b6d';mg.fillRect(c-22*s,c-22*s,44*s,44*s);mg.font='bold 20px sans-serif';mg.textAlign='center';mg.textBaseline='middle';mg.fillText('🏡',c,c);
  for(const fo of friendObjs){const f=fo.f;mg.fillStyle='#'+f.c.toString(16).padStart(6,'0');mg.beginPath();mg.arc(c+f.x*s,c+f.z*s,9,0,7);mg.fill();mg.fillStyle='#fff';mg.font='bold 12px sans-serif';mg.fillText(f.n[0],c+f.x*s,c+f.z*s+1);}
  if(S.own.busola||S.own.safari)for(const e of worldEggs){mg.fillStyle=e.gold?'#ffd54f':'#fff';mg.beginPath();mg.arc(c+e.x*s,c+e.z*s,4,0,7);mg.fill();}
  const px=c+player.pos.x*s,pz=c+player.pos.z*s;mg.translate(px,pz);mg.rotate(-player.face+Math.PI);mg.fillStyle='#ff3d6e';mg.strokeStyle='#fff';mg.lineWidth=2.5;mg.beginPath();mg.moveTo(0,-10);mg.lineTo(7,7);mg.lineTo(-7,7);mg.closePath();mg.fill();mg.stroke();
  mg.restore();}

/* ================= INIT & LOOP ================= */
for(let i=1;i<S.pens;i++)buildPen(i);buildPen(0);
for(const id in BUILD)if(S.own[id])buildBuilding(id);
for(const id in VEH)if(S.own[id])spawnVehicle(id);
refreshPlots();refreshLocks();placeAnimals();hud();
if(S.pos){player.pos.y=H(player.pos.x,player.pos.z);}
camYaw=player.face+Math.PI;
let T=0,last=performance.now(),uiT=0,mapT=0,saveT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  updatePlayer(dt);updatePlots(dt);updateAnimals(dt);updateEggs(dt);updateFriends(dt);updateWorld(dt);updateCamera(dt);
  uiT+=dt;if(uiT>.12){uiT=0;updateActionUI();$('#quest').textContent=quest();}
  mapT+=dt;if(mapT>.2){mapT=0;drawMini();}
  saveT+=dt;if(saveT>8){saveT=0;save();}
  renderer.render(scene,camera);requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
$('#loadTxt').outerHTML='<br><button id="play">▶ Joacă</button>';
$('#play').addEventListener('click',async()=>{snd(660,.1,'triangle');
  try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
  $('#load').remove();resize();});
requestAnimationFrame(loop);
if(!S.tut){S.tut=true;openModal(`<h2>🌍 Bun venit la Farm Planet!</h2>
<p>🕹️ <b>Joystick</b> stânga jos pentru mers, <b>Sari</b> în dreapta. Trage cu degetul pe ecran ca să rotești camera.</p>
<p>🌱 Plantează legume pe parcelele maro, așteaptă să crească și <b>recoltează</b>.</p>
<p>💰 Vinde-le la <b>Piață</b> și cumpără clădiri, unelte, tractor și mașină safari din 🛒.</p>
<p>🥚 Caută <b>ouă misterioase</b> în pădure și la munte (luminițele!). La <b>Cuibul magic</b> poate ieși un animal (60%) sau poate fi gol (40%).</p>
<p>🤝 Pe hartă sunt fermele prietenilor <b>Ana, Luca și Sofia</b> — ajută-i și primești cadouri!</p>
<p>👕 Schimbă-ți hainele și coafura din butonul mov.</p>
<div style="text-align:center;margin-top:10px"><button class="big" data-close>Hai să jucăm! 🚀</button></div>`);save();}
</script>
