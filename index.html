<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Farm Planet</title>
<meta name="theme-color" content="#7cc7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a1a;--panel:#fffaf0;--card:#ffffff;--accent:#ff8a3d;--green:#43b047;--blue:#3fa9f5;--bg:#7cc7ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:#fff6e6;--card:#ffffff}}
:root[data-theme="dark"]{--panel:#fff6e6;--card:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.hud button,.hud .pill{pointer-events:auto}
button{font-family:inherit;cursor:pointer}
.stats{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));display:flex;flex-direction:row;gap:6px}
.pill{background:rgba(255,250,240,.94);border:3px solid #fff;border-radius:999px;padding:0 12px 0 6px;font-weight:800;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:6px;min-width:84px;height:34px}
.pill .ic{font-size:20px}
#quest{position:absolute;top:calc(52px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));background:rgba(59,42,26,.8);color:#fff;padding:4px 14px;border-radius:14px;font-weight:700;font-size:14px;max-width:44vw;text-align:left;line-height:1.2}
.side{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;flex-direction:row-reverse;align-items:flex-start;gap:8px}
.btns{display:flex;flex-direction:column;gap:8px}
#mini{width:112px;height:112px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2);background:#5a9a3d;pointer-events:none}
.rbtn{width:52px;height:52px;border-radius:16px;border:3px solid #fff;background:var(--accent);font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
.rbtn:active,#jump:active,#act:active{transform:translateY(2px)}
#joy{position:absolute;left:calc(30px + env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.65);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(0,0,0,.2);pointer-events:none}
#jump{position:absolute;right:calc(24px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;background:var(--blue);border:4px solid #fff;font-size:16px;color:#fff;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.2);line-height:1}
#jump span{font-size:30px;display:block}
#act{position:absolute;right:122px;bottom:calc(36px + env(safe-area-inset-bottom));min-width:120px;max-width:52vw;min-height:62px;border-radius:20px;background:var(--green);border:4px solid #fff;color:#fff;font-weight:800;font-size:17px;padding:4px 14px;box-shadow:0 5px 0 rgba(0,0,0,.2);display:none;line-height:1.1}
#act.wait{background:#9e9e9e}
#veh{position:absolute;right:30px;bottom:calc(128px + env(safe-area-inset-bottom));display:none;background:#8d6e63}
#seeds{position:absolute;right:122px;bottom:calc(110px + env(safe-area-inset-bottom));display:none;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
.seed{background:#fffaf0;border:3px solid #fff;border-radius:14px;padding:2px 8px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15);color:var(--ink)}
.seed.sel{background:#ffe08a}
.seed.off{opacity:.45}
#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:90vw}
.t{background:rgba(255,250,240,.97);border:3px solid #fff;border-radius:16px;padding:6px 16px;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.18);animation:pop 2.4s forwards;text-align:center}
@keyframes pop{0%{transform:scale(.6);opacity:0}10%{transform:scale(1.06);opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
.modal.on{display:flex}
.box{background:var(--panel);border:5px solid #fff;border-radius:24px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:14px 16px 18px;box-shadow:0 8px 0 rgba(0,0,0,.2);position:relative;color:var(--ink)}
.modal.sheet{background:transparent;justify-content:flex-end;align-items:stretch;padding:8px}
.sheet .box{width:min(420px,54vw);max-height:none;height:100%}
.box h2{margin:0 44px 8px 0;font-size:24px;line-height:1.1}
.box h3{margin:10px 0 4px;font-size:17px}
.x{position:absolute;right:10px;top:8px;width:40px;height:40px;border-radius:12px;border:3px solid #fff;background:#ff6b6b;color:#fff;font-size:20px;font-weight:800;padding:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:3px solid #fff;border-radius:12px;background:#ffe0b2;padding:2px 10px;font-weight:800;font-size:15px;color:var(--ink)}
.tab.on{background:var(--accent);color:#fff}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 10px;margin:6px 0;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.item .em{font-size:32px;width:44px;text-align:center;flex:none}
.item .info{flex:1;line-height:1.15;min-width:0}
.item .info b{font-size:17px}
.item .info small{opacity:.75;font-size:13px;display:block}
.buy{border:3px solid #fff;border-radius:12px;background:var(--green);color:#fff;font-weight:800;font-size:15px;padding:4px 10px;min-width:84px;flex:none}
.buy[disabled]{background:#bdbdbd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.opt{border:3px solid #fff;background:var(--card);border-radius:14px;padding:6px 4px;font-weight:700;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.08);color:var(--ink);line-height:1.1}
.opt .em{font-size:26px;display:block}
.opt.on{outline:3px solid var(--accent);background:#fff3e0}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chr{border:3px solid #fff;background:var(--card);border-radius:16px;padding:0 0 4px;overflow:hidden;font-weight:800;font-size:13px;color:var(--ink);line-height:1.1;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.chr img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#ffe9c7}
.chr small{display:block;font-weight:600;opacity:.7}
.chr.on{outline:4px solid var(--accent)}
.chr.lock img{filter:saturate(.3) brightness(.85)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2);padding:0;font-size:16px}
.sw.on{outline:3px solid var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.egg-big{font-size:96px;text-align:center;margin:8px 0;line-height:1.1}
.wob{animation:wob .2s infinite alternate;display:inline-block}
@keyframes wob{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.big{border:4px solid #fff;border-radius:16px;background:var(--accent);color:#fff;font-weight:800;font-size:18px;padding:8px 18px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.big[disabled]{background:#bdbdbd}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.coll div{background:var(--card);border-radius:12px;text-align:center;padding:4px;font-size:12px;font-weight:700;line-height:1.1}
.coll div span{font-size:30px;display:block}
.coll .no span{filter:grayscale(1) brightness(.2);opacity:.35}
p{margin:6px 0;line-height:1.3}
#load{position:fixed;inset:0;background:linear-gradient(#7cc7ff,#bde8a8);display:grid;place-items:center;z-index:20;font-size:34px;font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center}
#bar{width:min(360px,70vw);height:18px;border-radius:12px;background:rgba(255,255,255,.4);border:3px solid #fff;margin:14px auto 4px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#loadTxt{font-size:16px}
@media (max-height:460px){#mini{width:96px;height:96px}.rbtn{width:46px;height:46px;font-size:22px;border-radius:14px}#joy{width:120px;height:120px}#jump{width:76px;height:76px}#act{right:112px;min-height:54px;font-size:16px}#seeds{right:112px;bottom:calc(98px + env(safe-area-inset-bottom))}#veh{bottom:calc(112px + env(safe-area-inset-bottom))}.pill{height:30px;font-size:16px;min-width:70px}#quest{top:calc(46px + env(safe-area-inset-top))}.box h2{font-size:21px}}
.looking #joy,.looking #quest,.looking #jump,.looking #act,.looking #seeds,.looking #veh,.looking .side{display:none!important}
#rotate{position:fixed;inset:0;z-index:30;background:linear-gradient(#7cc7ff,#bde8a8);display:none;place-items:center;text-align:center;color:#fff;font-weight:800;font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.25);padding:20px}
#rotate .ph{font-size:80px;display:inline-block;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:grid}}
.lvp{min-width:110px}.xpb{width:46px;height:8px;border-radius:6px;background:#e7dcc7;overflow:hidden;display:inline-block}.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb300,#ff8a3d)}
.rbtn.dim{filter:saturate(.3);opacity:.75}
.sw2{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 4px;border:2px solid #fff;box-shadow:0 1px 0 rgba(0,0,0,.2)}
#arrBar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;gap:6px;align-items:center;background:rgba(59,42,26,.85);padding:6px 8px;border-radius:16px;pointer-events:auto;max-width:96vw;flex-wrap:wrap;justify-content:center}
#arrBar span{color:#fff;font-weight:800;font-size:14px;padding:0 6px}
#arrBar button{border:3px solid #fff;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;padding:3px 10px}
#arrDone{background:var(--green)!important}
.arranging #arrBar{display:flex}
.arranging #joy,.arranging #quest,.arranging #jump,.arranging #act,.arranging #seeds,.arranging #veh,.arranging .side,.arranging .stats{display:none!important}
.btns{display:grid!important;grid-template-columns:repeat(2,auto);gap:8px}
.rbtn{position:relative}.dot{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:#ffd54f;border:2px solid #fff;display:none}.dot.on{display:block;animation:pulse 1s infinite alternate}
@keyframes pulse{from{transform:scale(.8)}to{transform:scale(1.15)}}
.bar2{height:10px;border-radius:6px;background:#eadfca;overflow:hidden;margin-top:3px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#43b047,#8bd65a)}
.rar{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:8px;padding:0 6px;margin-left:4px;vertical-align:middle}
.coll div{position:relative;border:3px solid transparent}.coll div small{display:block;font-size:10px;font-weight:700;opacity:.8}
.slot{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:74px;height:74px;margin:3px;border-radius:14px;background:var(--card);border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.08);font-weight:800;font-size:12px;color:var(--ink);vertical-align:top}.slot span{font-size:28px}
#play{margin-top:14px;border:5px solid #fff;border-radius:22px;background:var(--accent);color:#fff;font-weight:800;font-size:28px;padding:10px 34px;box-shadow:0 6px 0 rgba(0,0,0,.2);font-family:inherit;text-shadow:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="stats">
    <div class="pill"><span class="ic">🪙</span><span id="coins">0</span></div>
    <div class="pill"><span class="ic">🥚</span><span id="eggs">0</span></div>
    <div class="pill"><span class="ic">🐾</span><span id="ani">0</span></div>
    <div class="pill lvp"><span class="ic">⭐</span><span id="lv">1</span><span class="xpb"><i id="xpI"></i></span></div>
  </div>
  <div id="quest"></div>
  <div class="side">
    <canvas id="mini" width="224" height="224"></canvas>
    <div class="btns">
      <button class="rbtn" id="bShop" title="Magazin">🛒</button>
      <button class="rbtn" id="bLook" title="Personaj" style="background:#b06cff">👗</button>
      <button class="rbtn" id="bBag" title="Hambar" style="background:#4caf50">🎒</button>
      <button class="rbtn" id="bArr" title="Aranjează ferma" style="background:#3fa9f5">🏗️</button>
      <button class="rbtn" id="bOrd" title="Comenzi" style="background:#e0a800">📋</button>
      <button class="rbtn" id="bMis" title="Misiuni" style="background:#ef5350">🎯<i class="dot" id="misDot"></i></button>
    </div>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="seeds"></div>
  <button id="act"></button>
  <button class="rbtn" id="veh">🚜</button>
  <button id="jump"><span>⬆</span>Sari</button>
  <div id="toast"></div>
  <div id="arrBar"><span id="arrTxt">Mod aranjare</span><button id="arrZoomOut">➖</button><button id="arrZoomIn">➕</button><button id="arrRot">↻ Rotește</button><button id="arrDone">✔ Gata</button></div>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div id="load"><div>🌍 Farm Planet<div id="bar"><i id="barI"></i></div><div id="loadTxt">se încarcă lumea…</div></div></div>
<div id="rotate"><div><span class="ph">📱</span><br>Întoarce telefonul<br>pe orizontală 🔄</div></div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
 "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.js"}}
</script>
<script type="module" src="js/game.js"></script>
</body>
</html>
